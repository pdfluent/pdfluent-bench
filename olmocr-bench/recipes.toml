#
# Recipes of the olmocr-bench holdout. Same format and meaning as
# odl-bench/recipes.toml: a recipe names a set of `extract_markdown` keyword
# arguments, nothing else. Bump `version` on any change; every run.json carries
# the version, the file's SHA-256 and the full resolved configuration.
version = 1

[recipe.fast]
quality = "fast"

[recipe."balanced+tatr"]
quality = "balanced"
models = true
tatr = true
