# Tests and a real-data subset on every push, on the repository's own runner.
#
# Nothing here uses a hosted runner: the job runs on a machine labelled
# `pdfluent-bench`, so a push costs no hosted minutes. The workflow reacts to
# `push` and `workflow_dispatch` only, never to `pull_request`: a self-hosted
# runner executes whatever the triggering ref contains, so code from a fork must
# not reach it. tests/test_workflows.py enforces all of this.
#
# The runner needs: Linux, python3.12, poppler-utils (pdftotext), mupdf-tools
# (mutool), git and network access to PyPI and Hugging Face. For the full run
# it also needs docker.
name: ci
on:
  push:
  workflow_dispatch:
    inputs:
      full:
        description: "Run the full round (hours). Leave off for the same subset a push runs."
        type: boolean
        default: false
      configs:
        description: "Configurations for a full round (comma list, or all)"
        default: "all"
      sets:
        description: "Sets for a full round (comma list, or all)"
        default: "all"
      splits:
        description: "tuning, holdout or tuning,holdout"
        default: "tuning,holdout"
      because:
        description: "Why the holdout half is measured (written into every run file; required for holdout)"
        default: ""

permissions:
  contents: read

concurrency:
  group: bench-runner
  cancel-in-progress: false

jobs:
  subset:
    name: tests and the public subset on real pages
    runs-on: [self-hosted, linux, pdfluent-bench]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Tools the harness calls
        run: |
          for tool in python3.12 pdftotext mutool git; do
            command -v "$tool" >/dev/null || { echo "the runner has no $tool" >&2; exit 1; }
          done
      - name: Pinned tools, tests, surface check, ParseBench mini subset, schema check
        run: make repro PY=python3.12 WORK="$RUNNER_TEMP/work"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: subset-results
          path: results/ci-*

  full:
    name: full round (manual)
    if: github.event_name == 'workflow_dispatch' && inputs.full
    needs: subset
    runs-on: [self-hosted, linux, pdfluent-bench]
    timeout-minutes: 720
    steps:
      - uses: actions/checkout@v4
      - run: scripts/make_tools.sh "$RUNNER_TEMP/tools" python3.12
      - name: Images, then the round
        env:
          CONFIGS: ${{ inputs.configs }}
          SETS: ${{ inputs.sets }}
          SPLITS: ${{ inputs.splits }}
          BECAUSE: ${{ inputs.because }}
        run: |
          set -euo pipefail
          . "$RUNNER_TEMP/tools/env.sh"
          make images
          make bench MACHINE=local CONFIGS="$CONFIGS" SETS="$SETS" SPLITS="$SPLITS" \
            BECAUSE="$BECAUSE" RUNNER=docker WORK="$RUNNER_TEMP/work" PY="$BENCH_PY" \
            EXTRA="--out results/full-$(date -u +%Y%m%dT%H%M%SZ)"
      - run: |
          . "$RUNNER_TEMP/tools/env.sh"
          for run in results/full-*; do "$BENCH_PY" -m bench validate "$run"; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-results
          path: results/full-*
