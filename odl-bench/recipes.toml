#
# The recipes of the odl-bench set. One file, one place: a recipe is a name for
# a set of `extract_markdown` keyword arguments, nothing else. The adapter
# passes every key under `options` through; an option the installed wheel does
# not know is a TypeError and fails the run, it is never dropped.
#
#   quality  "fast" or "balanced"
#   models   true when the recipe needs the layout model (and the ONNX runtime)
#   tatr     true when the table structure model is switched on as well
#   options  extra keyword arguments of extract_markdown
#
# `routed` (fast, then balanced on the pages with a table) is not here yet.

[recipe.fast]
quality = "fast"

[recipe."fast+footers"]
quality = "fast"
options = { include_headers = true, include_footers = true }

[recipe.balanced]
quality = "balanced"
models = true

[recipe."balanced+kf"]
quality = "balanced"
models = true
options = { keep_furniture = true }

[recipe."balanced+tatr"]
quality = "balanced"
models = true
tatr = true

[recipe."balanced+tatr+kf"]
quality = "balanced"
models = true
tatr = true
options = { keep_furniture = true }
