[extractors.docling_minimal]
name = "Docling (TableFormer off)"
what = "Docling's PDF pipeline with do_table_structure = False and do_ocr = False. The layout model always runs: Docling has no PDF pipeline without it."
vendor = "the Docling project (IBM Research / LF AI & Data)"
licence = "MIT"
licence_kind = "open"
weights = "docling-project/docling-layout-heron (Apache-2.0); the table model is not loaded"
recipe = ""
version_command = "\"${DOCLING_MINIMAL_PYTHON:-/opt/ex/docling_minimal/bin/python}\" -c \"from importlib.metadata import version;print(version('docling'))\""
publishable = true
clause = "MIT, the grant; Apache-2.0 for the layout weights"
quote = "Permission is hereby granted, free of charge, to any person obtaining a copy of this software ... to deal in the Software without restriction."
source = "https://raw.githubusercontent.com/docling-project/docling/main/LICENSE and https://huggingface.co/docling-project/docling-layout-heron"
read_on = "2026-10-17"
verdict = "The same software and terms as the `docling` row, run with one pipeline option switched off. Nothing new to weigh."
is_an_extractor = true
is_an_oracle = false
on_the_rig = false
why_not = "a benchmark configuration of Docling, measured by pdfluent-bench only"
on_the_structured_rig = true
ocr = "off: do_ocr = False (bench_columns.py)"
version_pin = "2.126.0"
install = "docker/docling/Dockerfile"
outputs = "markdown"
offline = true
grounding = "bbox + page per item (provenance)"
confidence = "page-level scores, none per block"
model_cache = ["~/.cache/huggingface/hub/models--docling-project--docling-layout-heron"]

