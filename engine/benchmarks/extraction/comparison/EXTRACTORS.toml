source = "https://raw.githubusercontent.com/docling-project/docling/main/LICENSE and https://huggingface.co/ds4sd/docling-models"
read_on = "2026-09-07"
verdict = "Both halves are permissive. The code is MIT. The weights the default pipeline\ndownloads are published under CDLA-Permissive-2.0 and Apache-2.0, neither of\nwhich carries a use restriction, a field-of-use limit or a competitor clause --\nwhich is precisely what makes Docling measurable and Marker not.\n\nThe two repositories the default pipeline pulled on the rig are named in the\n`weights` field above, read off the machine after the run rather than assumed:\n`docling-models` (layout and TableFormer) and `docling-layout-heron`. A model\nlicence that changed between this reading and the next round would otherwise be\ninvisible, so the next round reads the cache again rather than this line.\n\nOne measurement caveat that is not a licence question: Docling is a layout\npipeline, its natural output is Markdown, and our four axes read plain text.\nThe adapter takes its plain-text export. That is the fairest available reading\nof a tool whose selling point is structure, and it is also the reason a poor\nscore here is not a verdict on Docling: this table measures characters and\ntheir order, not tables and headings.\n"
is_an_extractor = true
is_an_oracle = false
on_the_rig = true
on_the_structured_rig = true
ocr = "off: do_ocr = False (extract_structured.py)"
version_pin = "2.126.0"
install = "/opt/ex/docling venv, scripts/extraction/rig_bootstrap.sh"
outputs = "markdown; blocks with bbox (DoclingDocument)"
offline = true
grounding = "bbox + page per item (provenance)"
confidence = "page-level scores, none per block"
model_cache = ["~/.cache/huggingface/hub/models--docling-project--docling-models", "~/.cache/huggingface/hub/models--docling-project--docling-layout-heron", "~/.cache/huggingface/hub/models--ds4sd--docling-models"]

