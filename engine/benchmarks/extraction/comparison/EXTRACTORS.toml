[extractors.pdfluent]
name = "PDFluent"
what = "ours, source build, `pdfluent-cli extract-text`"
vendor = "Innovation Trigger B.V."
licence = "AGPL-3.0-only OR LicenseRef-PDFluent-Commercial"
licence_kind = "open"
ours = true
recipe = "target/release/pdfluent-cli extract-text {in}"
version_command = "echo \"${PDFLUENT_COMMIT:-$(git rev-parse --short HEAD)}\""
publishable = true
clause = "our own"
quote = ""
source = "LICENSE"
read_on = "2026-09-07"
verdict = "Ourselves, in the same table and under the same rules, because a comparison in\nwhich only the other side has to declare its terms is not a comparison.\n\nOur version is the commit, which is what a source build has instead of a\nrelease. `PDFLUENT_COMMIT` overrides it because the rig runs from an export of\nthe tree rather than a checkout -- the alternative was shipping a clone\ncredential to a throwaway cloud machine to make `git rev-parse` work.\n\nThe extraction side has no watermark problem: `extract-text` on an unlicensed\nbuild writes the document's text and nothing of its own. That is worth stating\nbecause the PDF/A comparison next door has to caveat exactly this, and a reader\nwho has read that file will look for the same caveat here.\n"
is_an_extractor = true
is_an_oracle = false
on_the_rig = true
on_the_structured_rig = true
ocr = "off: the text layer only"
version_pin = "the commit"
install = "cargo build --release --example structured_markdown"
outputs = "markdown; blocks with bbox through the block model"
offline = true
grounding = "bbox + page per block (block model JSON)"
confidence = "none yet (#599, #600)"

