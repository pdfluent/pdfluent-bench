publishable = true
clause = "AGPL-3.0 §2 (running) and §13 (remote network interaction)"
quote = "This License explicitly affirms your unlimited permission to run the unmodified Program."
source = "https://raw.githubusercontent.com/pymupdf/pymupdf4llm/main/LICENSE, https://raw.githubusercontent.com/pymupdf/PyMuPDF/main/COPYING, https://raw.githubusercontent.com/ArtifexSoftware/pymupdf_layout/main/LICENSE, and the wheel's COPYING"
read_on = "2026-09-23"
verdict = "Measurable and publishable. This is the AGPL verdict #620 asked for in writing.\n\nWe run the unmodified program on our own machine and publish numbers about its\noutput. §2 grants \"unlimited permission to run the unmodified Program\". §13 --\nthe clause that reaches network use -- applies only \"if you modify the\nProgram\", and we do not. Nothing is conveyed: the rig installs from PyPI and is\ndeleted after the round, and no part of pymupdf4llm, PyMuPDF or the bundled\nmodels enters our code or our distribution. Measuring is not distributing.\n\nThat it is AGPL matters in a different place: it is why a buyer shipping a\nclosed product needs Artifex's commercial licence, and the table's licence\ncolumn says so rather than letting \"open source\" stand for \"free to embed\".\nThe PyMuPDF column of #390 was read on the same terms.\n\nThe layout models are inside the wheel and carry the wheel's licence, so there\nis no separate weights licence to read, and nothing is downloaded at run time.\n"
is_an_extractor = true
is_an_oracle = false
on_the_rig = false
why_not = "measured on the structured rig (#619); its text engine is PyMuPDF, which is on the plain-text rig under its own name"
on_the_structured_rig = true
ocr = "off: OCRMode.NEVER in the adapter, although a Tesseract is on the rig for Unstructured"
version_pin = "1.28.2 (pins pymupdf==1.28.2 and pymupdf_layout==1.28.2)"
install = "pip install pymupdf4llm==1.28.2 into /opt/ex/pymupdf4llm"
