verdict = "REPLACES #575's refusal FOR THIS SOURCE (COS, 30-09-2026: check, then accept).\n#575 refused FinTabNet mirrors on provenance -- a licence tag on an anonymous\nre-upload is not evidence -- and that stays the rule. This mirror is accepted\nbecause its provenance was MEASURED rather than taken from its tag:\n\n* It is IBM's release member for member: 89,646 PDFs under\n  fintabnet/pdf/<company>/<year>/, the six FinTabNet_1.0.0_*.jsonl and IBM's\n  fintabnet/LICENSE.txt, which is the full CDLA-Permissive-1.0 -- what IBM's\n  own dataset page (archived 2022-01-25) describes: \"Format PDF, JSON\",\n  \"89,646 pages comprising 112,887 tables\", \"License CDLA-Permissive\", 16 GB.\n* Its PDFs are the PDFs Microsoft annotated FinTabNet.c from. On 852 pages,\n  two from each of the 428 companies, 38,967 table cells (92.9 %) read the\n  same text in the same place on our PDF as Microsoft's `pdf_text_content` and\n  `pdf_text_tight_bbox`, the box within 0.5 pt; the 2,828 that differ were\n  read in a different order (a superscript `(1)` sorted before its line) or\n  with the dot leaders Microsoft strips, and the text on both sides is the\n  same (gs://pdfluent-datasets/fintabnet/1.0.0/provenance_check/ftn_check.json).\n  Another set of PDFs could not agree to half a point on 39,000 cells.\n* No checksum of the release was ever published by IBM or Microsoft; the\n  archive's sha256 above and the jsonl files' in the provenance check are ours,\n  so that a later fetch can be held to this one.\n\nThe terms: CDLA-Permissive-1.0 §3.1 lets anyone who received the data publish\nit under a licence of their choice as long as the text of the agreement goes\nwith it and the credit to IBM is kept. The mirror carries the agreement's text\nand IBM's release unchanged, which is exactly that; so its copy is a lawful\ncopy of IBM's data under IBM's terms. The annotations are FinTabNet.c's, under\nCDLA-Permissive-2.0, as in its own row.\n\nThe documents are single pages of public SEC filings (annual reports) of\nS&P 500 companies; IBM licensed the compilation, and the filings are public\nrecords. That is the reading IBM's own page gives.\n"
on_the_rig = true

[datasets.parsebench]
name = "ParseBench"
what = "2,078 business-document pages (insurance filings, financial reports, government) in five categories: tables, charts, text content, formatting, layout"
vendor = "LlamaIndex (run-llama)"
licence = "Apache-2.0 (dataset card), over third-party documents it does not own"
training_use = "refused: measurement only (#622); and the documents are third-party web PDFs no licence of theirs covers -- scripts/ci/learned_training_uses_no_rig_document.py refuses any of them in a training manifest."
pages = 2037
version = "llamaindex/ParseBench, the PDF pages under docs/ (chart, layout, table, text); the 42 JPG/PNG layout pages are left out"
source = "https://huggingface.co/datasets/llamaindex/ParseBench"
repo_id = "llamaindex/ParseBench"
revision = "2805a1d940f95a203e0ae4b88be9934f7765b3fc"
documents = "pdf"
ground_truth = "Not blocks. Per category, a JSONL of test rules: tables as ground-truth HTML\n(scored GriTS + TableRecordMatch), charts as spot-check data points, text as\nrules generated from a full Markdown transcription (missing/extra words,\ndigits, pairwise reading order, header/footer), formatting as positive and\nnegative style tests, and layout as boxes with class, content and reading\norder (Text, Table, Picture, Page-Header, Page-Footer). A VLM labelled every\npage first; humans verified and corrected it.\n"
annotator = "human-verified (VLM first pass, corrected by people)"
annotates = ["table", "paragraph", "furniture"]
publishable = true
clause = "the dataset card's Copyright Statement, and Apache-2.0 §2 through the card's `license: apache-2.0`"
quote = "All documents are sourced from public online channels. The dataset is released under the Apache 2.0 License. If there are any copyright concerns, please contact us via the GitHub repository."
licence_source = "https://huggingface.co/datasets/llamaindex/ParseBench (README and cardData.license at 2805a1d9), https://github.com/run-llama/ParseBench/blob/main/LICENSE (code, Apache-2.0), arXiv:2604.08538 §2.2 (provenance)"
read_on = "2026-09-23"
verdict = "Cleared for measurement and for publishing aggregate numbers, with three\nconditions this programme sets itself. The reading is a judgement in one place,\nand it is taken against us.\n\nWHAT THE TERMS SAY. The card declares Apache-2.0 -- in its metadata and one\nsentence of its README; the repository has no LICENSE file of its own. There is\nno non-commercial, research-only, no-derivatives or no-training clause, and no\ngate or click-through. That is the difference from OmniDocBench two rows up,\nwhose own sentence forbids commercial use; nothing here does.\n\nTHE JUDGEMENT. LlamaIndex can license what it owns: the rules, the\ntranscriptions, the selection. It cannot license the documents. Per the paper\n(§2.2) they were crawled from the web -- SERFF insurance filings (54% of the\ntable pages), public financial reports, government documents -- with a few\npages from FinTabNet (CDLA-Permissive-2.0, read two rows down) and VRDU (not\nread; three table pages, not identifiable from the file names). Their owners'\ncopyright is untouched by the card's Apache-2.0, and the card says as much by\npointing copyright concerns at the maintainers.\n\nWhat we do with them is make a copy on a machine that is deleted after the\nround, run tools over it, and publish scores. A score is not a reproduction of\na document. So the reading is: measuring is fine, and nothing of a document may\nleave the machine in a form that republishes it. Hence the conditions:\n\n  1. nothing we publish carries page content -- no text excerpts, no renders,\n     no crops; a table may name a page by its file name and nothing more;\n  2. the round's evidence (every tool's output per page) is private, stays out\n     of the repository and is deleted with the machine's other copies;\n  3. never training, which #622 asks for and which the documents' status would\n     require anyway.\n\nPII is not addressed by the card, the README, the paper or the blog, and the\ntext category includes contracts, handwriting and scanned pages. Condition 1\nand 2 are also what keeps any of that from travelling.\n\nWHAT IT CAN AND CANNOT ANSWER. Its ground truth is rules, not the blocks our\naxes read, so the round measures it through its own scorer on each tool's\nMarkdown -- which is also what makes the numbers comparable with LlamaIndex's\npublished ones -- and the layout category, which has boxes, is the one that can\nspeak to our axes. Which of the two #623 runs is decided there; this row only\nclears the set.\n\nDECIDED IN #623: its own scorer, on three of the four PDF categories (table,\nchart, text as content and as formatting), through\n`scripts/extraction/parsebench_round.py`. Layout is left out and the run file\nsays why: ParseBench scores it from boxes in a LayoutOutput, and every column is\nhanded over as Markdown, so each would score nothing for a reason that is ours.\nCondition 2 is kept by the round and not by a promise: each column's Markdown\nstays in the machine's work directory, which the remote round does not stage,\nand the run file carries metric values and page names only (its self-test fails\nwhen page text reaches it).\n"
on_the_rig = true
