licence_source = "https://huggingface.co/datasets/bsmock/pubtables-1m (`license: cdla-permissive-2.0`), https://cdla.dev/permissive-2-0/, and https://pmc.ncbi.nlm.nih.gov/tools/openftlist/"
read_on = "2026-09-20"
verdict = "On the rig, and it is the first set here whose verdict is two verdicts.\n\nTHE ANNOTATIONS. CDLA-Permissive-2.0, published by Microsoft beside the\ntable-transformer code. §1.1 grants use, modification and sharing with no\nfield-of-use limit and no non-commercial clause; §3.1 says in as many words\nthat the agreement imposes no restriction on Results, and a measurement is a\nResult. The only condition, §2.1, is on SHARING the data -- carry the text of\nthe agreement with it -- and nothing of this set is shared from this\nrepository: the manifest names documents and digests, as the two corpus rows\nnext door do.\n\nA correction that belongs in this file rather than in a commit message: the\nFinTabNet.c and PubTables-1M rows written on 2026-09-17 quoted CDLA-Permissive\n1.0's §2.1 under 2.0's number. The two agreements are not the same text -- 2.0\nis shorter, its grant is §1.1, and its §2.1 is the sharing condition. The\nreading did not change; the citation was wrong, and a register whose quote is\nnot the clause is a register that has been copied rather than read.\n\nTHE DOCUMENTS, which is the half that decided 2026-09-17 against this set and\nis the half that moved. PubTables-1M ships table and page images; the PDFs are\nthe PubMed Central articles the annotations were made from. Those are fetchable\n-- the PMC Cloud Service on AWS Open Data serves one PDF per article -- with\ntwo conditions the subset states itself:\n\n  1. \"The PMC Cloud Service, PMC OAI-PMH Service, E-Utilities and BioC API are\n     the only services that may be used for automated retrieval of PMC content.\n     Systematic retrieval (or bulk retrieval) of articles through any other\n     automated process is prohibited.\" So the fetch goes through the Cloud\n     Service and nowhere else. The old FTP tree, which the 2026-09-17 reading\n     would have reached for, is being removed and is not a permitted route in\n     any case.\n\n  2. \"License terms vary. Please refer to the license statement in each\n     article.\" A blanket reading of \"the Open Access Subset\" is therefore a\n     reading of nothing, and the subset contains non-commercial articles. The\n     Cloud Service publishes each article's own licence code in the metadata\n     beside its PDF, which is that statement in a form a protocol can obey, so\n     the fetch reads it per article and keeps CC0 and CC BY.\n\nWHY ONLY CC0 AND CC BY, when CC BY-SA and CC BY-ND also permit commercial use.\nThe same rule the refusals here were decided under: where the reading is a\njudgement, it errs against us. Share-alike and no-derivatives raise a question\nabout what a measurement and an evidence tarball are, and this set does not\nneed the articles that would make us answer it -- the subset is large and the\nround is a few hundred pages. An article with no code, or one whose code is not\nin the list, is refused by name and counted in the manifest, so the corpus can\nbe read back as \"what was allowed\" rather than \"what was taken\".\n\nWHAT THIS SET DOES NOT ANSWER. Everything except tables. It annotates tables\nand nothing else on the page, so the text, heading, list and reading-order axes\nare NOT scored here and the run file says so per axis rather than reporting a\nzero -- a zero on a text axis over a corpus that never drew the text is a\nstatement about the corpus. DocLayNet stays the set for those five.\n"
on_the_rig = true

