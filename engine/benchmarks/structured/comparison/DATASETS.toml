publishable = true
clause = "CDLA-Permissive-1.0, §2.1"
quote = "Subject to the terms and conditions of this agreement, each Data Provider grants to You a perpetual, irrevocable, worldwide, non-exclusive, no-charge, royalty-free license to use, modify, and Publish the Data."
licence_source = "https://huggingface.co/datasets/docling-project/DocLayNet-v1.2 (`Licensing Information`), and https://cdla.io/permissive-1-0/"
read_on = "2026-09-17"
verdict = "A permissive data licence with no field-of-use limit, no non-commercial clause\nand an explicit grant to publish. Nothing to weigh, which is why this is the set\nthe baseline runs on.\n\nTwo properties beyond the licence earned it the rig, and both are the reason\nthis milestone can be measured at all:\n\nIt ships the ORIGINAL PDF. Every other candidate ships renderings, and a page\nimage is a document our extraction cannot read -- not badly, at all. A baseline\ntaken there would report zero for us and a real number for two model pipelines,\nand the zero would be a statement about the corpus rather than about the code.\n\nIts ground truth is a human drawing boxes and naming them. That is what makes\nheadings, lists and reading order measurable rather than inferred from another\nextractor's opinion.\n\nTHE CAVEAT THAT HAS TO TRAVEL WITH EVERY TEXT NUMBER: the boxes and the classes\nare human, and the TEXT inside them is not -- `pdf_cells` is IBM's own parser\nreading the same PDF. So the text axis on this set is agreement with another\nextractor and not with a transcription, which is the same footing the oracle in\n`../../extraction/comparison/EXTRACTORS.toml` sits on and is stated for the same\nreason. The heading, list and order axes do not inherit it: which blocks are\nheadings is the human's judgement, and that is what those axes score.\n\nWHAT THE FIRST ROUND FOUND OUT ABOUT IT (run\nstructured-doclaynet-20260917T192519Z). The annotation order is NOT the order\ngeometry would give: over 188 pages it agrees with a plain top-down reading at\n0.606, and 131 of them are under 0.9. That is the evidence this set's `bboxes`\norder carries reading order rather than the order boxes happened to be drawn\nin -- so the order axis has something to measure. Both readings are reported\nanyway, because \"the annotator's order\" and \"what the page looks like\" are two\nquestions and a tool can be good at one.\n\nThe sample of that round was thirteen documents, 139 of its 200 pages financial\nreports. The set as a whole is six categories over 196 documents; a 200-page\nsample of whole documents is necessarily a handful of them, and any figure from\none round is a figure about those. The seeded rule makes the next round ask for\nthe same pages rather than a flattering draw, which is the property that\nmatters; a wider spread is a bigger round.\n\nIT ALSO CANNOT ANSWER THE TABLE QUESTION. A Table box says where the table is\nand nothing about its rows, so TEDS is not computable here. See the two rows\nbelow, which is where that question goes.\n"
on_the_rig = true

