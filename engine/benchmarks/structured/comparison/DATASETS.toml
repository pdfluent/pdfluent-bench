ground_truth = "Eleven block classes per page -- Caption, Footnote, Formula, List-item,\nPage-footer, Page-header, Picture, Section-header, Table, Text, Title -- as\nboxes, with the PDF text cells inside each box. Headings are Section-header and\nTitle, lists are List-item, tables are boxes WITHOUT an internal structure.\n"
